<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workorder Database Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --border: #e8eaed;
      --border-light: #f1f3f6;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-border: #bfdbfe;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --red: #dc2626;
      --red-light: #fef2f2;
      --orange: #d97706;
      --orange-light: #fffbeb;
      --purple: #7c3aed;
      --purple-light: #f5f3ff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Top Nav ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { color: #fff; }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }

    .btn-outline {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { border-color: #aab5c7; color: var(--text-primary); }

    .btn-danger-outline {
      background: var(--surface);
      color: var(--red);
      border: 1px solid #fecaca;
    }

    .btn-danger-outline:hover { background: var(--red-light); }

    /* ── Layout ── */
    .layout {
      display: flex;
      height: calc(100vh - 58px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-section-title {
      padding: 18px 18px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-left: 3px solid transparent;
      transition: all 0.12s;
    }

    .sidebar-item:hover {
      background: var(--bg);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: var(--accent-light);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .sidebar-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-item-count {
      margin-left: auto;
      background: var(--border-light);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 20px;
      min-width: 22px;
      text-align: center;
    }

    .sidebar-item.active .sidebar-item-count {
      background: var(--accent-border);
      color: var(--accent);
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border-light);
      margin: 8px 0;
    }

    /* ── Main Content ── */
    .main {
      flex: 1;
      overflow: auto;
      padding: 28px;
    }

    /* ── Stats cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-body { min-width: 0; }
    .stat-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Table card ── */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .table-row-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .table-search {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg);
      outline: none;
      width: 220px;
      transition: all 0.15s;
    }

    .table-search:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
    }

    .table-search::placeholder { color: var(--text-muted); }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    th:hover { color: var(--text-primary); }

    th .sort-indicator { margin-left: 4px; opacity: 0.5; }
    th.sorted .sort-indicator { opacity: 1; color: var(--accent); }

    tbody tr {
      border-bottom: 1px solid var(--border-light);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8faff; }

    td {
      padding: 10px 14px;
      color: var(--text-primary);
      max-width: 300px;
      word-break: break-word;
    }

    .cell-id {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .cell-truncate {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cell-null {
      color: var(--text-muted);
      font-style: italic;
      font-size: 12px;
    }

    /* Status badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-draft       { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .badge-pending     { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
    .badge-approved    { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .badge-rejected    { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-cancelled   { background: #f9fafb; color: #6b7280; border: 1px solid #d1d5db; }
    .badge-inprogress  { background: #eff6ff; color: #2563eb; border: 1px solid #93c5fd; }
    .badge-completed   { background: #f0fdf4; color: #166534; border: 1px solid #4ade80; }
    .badge-done        { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
    .badge-undone      { background: #fff7ed; color: #c2410c; border: 1px solid #fb923c; }
    .badge-default     { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }

    /* Pagination */
    .pagination {
      padding: 12px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pagination-info {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .page-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.12s;
    }

    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Loading / empty */
    .state-box {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .state-box svg { margin-bottom: 12px; opacity: 0.35; }
    .state-box h3 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
    .state-box p  { font-size: 13px; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* DB info bar */
    .db-info-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .db-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .db-info-item strong { color: var(--text-primary); font-weight: 600; }

    .db-info-sep { width: 1px; height: 14px; background: var(--border); }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>

<!-- Top Navigation -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M22 12H2M22 6H2M22 18H2" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">Workorder DB Viewer</div>
      <div class="brand-tag">SQLite · Live Data</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-outline" onclick="refreshAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Refresh
    </button>
    <button class="btn btn-danger-outline" id="resetBtn" onclick="handleReset()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      Reset to Seed Data
    </button>
  </div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-section-title">Tables</div>
    <button class="sidebar-item active" id="nav-workorders" onclick="showTable('workorders')">
      <span class="sidebar-item-dot" style="background:#2563eb"></span>
      workorders
      <span class="sidebar-item-count" id="cnt-workorders">—</span>
    </button>
    <button class="sidebar-item" id="nav-groups" onclick="showTable('groups')">
      <span class="sidebar-item-dot" style="background:#7c3aed"></span>
      groups
      <span class="sidebar-item-count" id="cnt-groups">—</span>
    </button>
    <button class="sidebar-item" id="nav-items" onclick="showTable('items')">
      <span class="sidebar-item-dot" style="background:#0891b2"></span>
      items
      <span class="sidebar-item-count" id="cnt-items">—</span>
    </button>
    <button class="sidebar-item" id="nav-item_options" onclick="showTable('item_options')">
      <span class="sidebar-item-dot" style="background:#059669"></span>
      item_options
      <span class="sidebar-item-count" id="cnt-item_options">—</span>
    </button>
    <button class="sidebar-item" id="nav-audit_trail" onclick="showTable('audit_trail')">
      <span class="sidebar-item-dot" style="background:#d97706"></span>
      audit_trail
      <span class="sidebar-item-count" id="cnt-audit_trail">—</span>
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-section-title">Quick Views</div>
    <button class="sidebar-item" onclick="showCustomQuery(`SELECT w.id, w.name, w.status, w.createdBy, w.createdAt, COUNT(DISTINCT g.id) as groups, COUNT(i.id) as items FROM workorders w LEFT JOIN groups g ON g.workorderId = w.id LEFT JOIN items i ON i.groupId = g.id GROUP BY w.id ORDER BY w.rowid DESC`, 'Workorders Summary')">
      <span class="sidebar-item-dot" style="background:#6b7280"></span>
      Workorders Summary
    </button>
    <button class="sidebar-item" onclick="showCustomQuery(`SELECT i.*, g.name as groupName, g.workorderId FROM items i JOIN groups g ON i.groupId = g.id ORDER BY i.rowid DESC`, 'All Items with Group')">
      <span class="sidebar-item-dot" style="background:#6b7280"></span>
      Items with Group
    </button>
    <button class="sidebar-item" onclick="showCustomQuery(`SELECT a.*, w.name as workorderName FROM audit_trail a JOIN workorders w ON a.workorderId = w.id ORDER BY a.rowid DESC LIMIT 100`, 'Recent Audit Events')">
      <span class="sidebar-item-dot" style="background:#6b7280"></span>
      Recent Audit Events
    </button>
  </nav>

  <!-- Main content -->
  <main class="main" id="main">
    <!-- Stats -->
    <div class="db-info-bar" id="dbInfoBar">
      <div class="db-info-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <span>Loading database info…</span>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#eff6ff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="stat-workorders">—</div>
          <div class="stat-label">Workorders</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#f5f3ff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="stat-groups">—</div>
          <div class="stat-label">Groups</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#ecfeff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="stat-items">—</div>
          <div class="stat-label">Items</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fffbeb">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="stat-audit">—</div>
          <div class="stat-label">Audit Events</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#f0fdf4">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-value" id="stat-dbsize">—</div>
          <div class="stat-label">DB Size</div>
        </div>
      </div>
    </div>

    <!-- Table view -->
    <div id="tableSection">
      <div class="section-header">
        <div>
          <div class="section-title" id="currentTableTitle">workorders</div>
          <div class="section-subtitle" id="currentTableSubtitle">Main workorder metadata and approval status</div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <div class="table-header-left">
            <span class="table-name" id="tableNameLabel">workorders</span>
            <span class="table-row-count" id="tableRowCount">0 rows</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input
              type="text"
              class="table-search"
              id="tableSearch"
              placeholder="Search rows…"
              oninput="onSearch(this.value)"
            />
            <button class="btn btn-outline" onclick="exportCSV()" style="font-size:12px;padding:6px 12px">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <div id="tableContent">
            <div class="state-box">
              <div class="spinner"></div>
              <p>Loading table data…</p>
            </div>
          </div>
        </div>
        <div class="pagination" id="pagination" style="display:none">
          <span class="pagination-info" id="pageInfo"></span>
          <div class="pagination-controls" id="pageControls"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  const PAGE_SIZE = 25;

  const TABLE_DESCS = {
    workorders: 'Main workorder metadata and approval status',
    groups: 'Groups that organize items within a workorder',
    items: 'Individual checklist tasks inside each group',
    item_options: 'Dropdown option values for Single Select items',
    audit_trail: 'History of changes and approval actions',
  };

  let allRows = [];
  let filteredRows = [];
  let currentTable = 'workorders';
  let currentPage = 1;
  let sortCol = null;
  let sortDir = 1;
  let customQueryLabel = null;

  // ── Status badge ─────────────────────────────────────────────────────────────
  function statusBadge(status) {
    if (!status) return '<span class="cell-null">—</span>';
    const map = {
      'Draft': 'draft',
      'Pending Approval': 'pending',
      'Approved': 'approved',
      'Rejected': 'rejected',
      'Cancelled': 'cancelled',
      'In Progress': 'inprogress',
      'Pending Execution': 'inprogress',
      'Completed': 'completed',
      'Done': 'done',
      'Undone': 'undone',
      'Pending': 'pending',
    };
    const cls = map[status] || 'default';
    return `<span class="badge badge-${cls}">${escHtml(status)}</span>`;
  }

  function escHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatCell(col, val) {
    if (val === null || val === undefined || val === '') return '<span class="cell-null">—</span>';
    const colLower = col.toLowerCase();
    if (colLower === 'status' || colLower === 'executionstatus') return statusBadge(val);
    if (colLower === 'id' || colLower.endsWith('id')) {
      return `<span class="cell-id">${escHtml(val)}</span>`;
    }
    const s = String(val);
    if (s.length > 60) return `<span class="cell-truncate" title="${escHtml(s)}">${escHtml(s.substring(0, 60))}…</span>`;
    return escHtml(s);
  }

  // ── Load DB info & stats ──────────────────────────────────────────────────────
  async function loadDbInfo() {
    try {
      const info = await fetch(`${API}/api/db-info`).then(r => r.json());
      const sizeFmt = info.dbSize < 1024 ? `${info.dbSize} B` :
                      info.dbSize < 1048576 ? `${(info.dbSize/1024).toFixed(1)} KB` :
                      `${(info.dbSize/1048576).toFixed(2)} MB`;

      document.getElementById('stat-workorders').textContent = info.counts.workorders;
      document.getElementById('stat-groups').textContent = info.counts.groups;
      document.getElementById('stat-items').textContent = info.counts.items;
      document.getElementById('stat-audit').textContent = '—'; // fetched separately
      document.getElementById('stat-dbsize').textContent = sizeFmt;

      document.getElementById('dbInfoBar').innerHTML = `
        <div class="db-info-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>Database: <strong>workorders.db</strong></span>
        </div>
        <div class="db-info-sep"></div>
        <div class="db-info-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>Size: <strong>${sizeFmt}</strong></span>
        </div>
        <div class="db-info-sep"></div>
        <div class="db-info-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>
          <span>Journal: <strong>${info.journalMode.toUpperCase()}</strong></span>
        </div>
        <div class="db-info-sep"></div>
        <div class="db-info-item">
          <span>Total rows: <strong>${info.counts.workorders + info.counts.groups + info.counts.items}</strong></span>
        </div>
      `;

      // Update sidebar counts
      document.getElementById('cnt-workorders').textContent = info.counts.workorders;
      document.getElementById('cnt-groups').textContent = info.counts.groups;
      document.getElementById('cnt-items').textContent = info.counts.items;
    } catch(e) {
      console.error(e);
    }
  }

  // ── Load table rows ───────────────────────────────────────────────────────────
  async function loadTable(tableName) {
    document.getElementById('tableContent').innerHTML = `<div class="state-box"><div class="spinner"></div><p>Loading ${tableName}…</p></div>`;
    document.getElementById('pagination').style.display = 'none';

    try {
      const rows = await fetch(`${API}/api/db-table/${tableName}`).then(r => r.json());
      allRows = rows;

      // Sidebar count update
      const cntEl = document.getElementById(`cnt-${tableName}`);
      if (cntEl) cntEl.textContent = rows.length;
      if (tableName === 'audit_trail') document.getElementById('stat-audit').textContent = rows.length;
      if (tableName === 'item_options') document.getElementById('cnt-item_options').textContent = rows.length;

      renderRows(rows);
    } catch(e) {
      document.getElementById('tableContent').innerHTML = `<div class="state-box"><h3>Error loading table</h3><p>${e.message}</p></div>`;
    }
  }

  // ── Render rows into table ────────────────────────────────────────────────────
  function renderRows(rows) {
    filteredRows = rows;
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = filteredRows.slice(start, start + PAGE_SIZE);
    const total = filteredRows.length;

    if (total === 0) {
      document.getElementById('tableContent').innerHTML = `
        <div class="state-box">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <h3>No rows found</h3>
          <p>Try adjusting your search.</p>
        </div>`;
      document.getElementById('pagination').style.display = 'none';
      document.getElementById('tableRowCount').textContent = '0 rows';
      return;
    }

    const cols = Object.keys(pageRows[0]);
    let html = `<table><thead><tr>`;
    cols.forEach(col => {
      const isSorted = sortCol === col;
      const arrow = isSorted ? (sortDir === 1 ? '↑' : '↓') : '↕';
      html += `<th class="${isSorted ? 'sorted' : ''}" onclick="sortBy('${col}')">
        ${escHtml(col)} <span class="sort-indicator">${arrow}</span>
      </th>`;
    });
    html += `</tr></thead><tbody>`;
    pageRows.forEach(row => {
      html += `<tr>`;
      cols.forEach(col => {
        html += `<td>${formatCell(col, row[col])}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;

    document.getElementById('tableContent').innerHTML = html;
    document.getElementById('tableRowCount').textContent = `${total.toLocaleString()} row${total !== 1 ? 's' : ''}`;

    // Pagination
    const totalPages = Math.ceil(total / PAGE_SIZE);
    if (totalPages > 1) {
      document.getElementById('pagination').style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total.toLocaleString()}`;
      renderPageControls(totalPages);
    } else {
      document.getElementById('pagination').style.display = 'none';
    }
  }

  function renderPageControls(totalPages) {
    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const range = [];
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= currentPage - 2 && p <= currentPage + 2)) range.push(p);
      else if (range[range.length - 1] !== '…') range.push('…');
    }
    range.forEach(p => {
      if (p === '…') html += `<button class="page-btn" disabled>…</button>`;
      else html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
    });
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
    document.getElementById('pageControls').innerHTML = html;
  }

  function goPage(p) {
    const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderPage();
  }

  // ── Sort ──────────────────────────────────────────────────────────────────────
  function sortBy(col) {
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }

    filteredRows = [...filteredRows].sort((a, b) => {
      const va = a[col] ?? '';
      const vb = b[col] ?? '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb)) * sortDir;
    });
    currentPage = 1;
    renderPage();
  }

  // ── Search ────────────────────────────────────────────────────────────────────
  function onSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) { filteredRows = allRows; }
    else {
      filteredRows = allRows.filter(row =>
        Object.values(row).some(v => String(v ?? '').toLowerCase().includes(q))
      );
    }
    sortCol = null; sortDir = 1;
    currentPage = 1;
    renderPage();
  }

  // ── Show table ────────────────────────────────────────────────────────────────
  function showTable(tableName) {
    currentTable = tableName;
    customQueryLabel = null;
    sortCol = null; sortDir = 1;

    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    const navEl = document.getElementById(`nav-${tableName}`);
    if (navEl) navEl.classList.add('active');

    document.getElementById('tableSearch').value = '';
    document.getElementById('currentTableTitle').textContent = tableName;
    document.getElementById('currentTableSubtitle').textContent = TABLE_DESCS[tableName] || '';
    document.getElementById('tableNameLabel').textContent = tableName;

    loadTable(tableName);
  }

  // ── Custom SQL query ──────────────────────────────────────────────────────────
  async function showCustomQuery(sql, label) {
    customQueryLabel = label;
    sortCol = null; sortDir = 1;

    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.getElementById('tableSearch').value = '';
    document.getElementById('currentTableTitle').textContent = label;
    document.getElementById('currentTableSubtitle').textContent = 'Quick view · custom query';
    document.getElementById('tableNameLabel').textContent = label;
    document.getElementById('tableContent').innerHTML = `<div class="state-box"><div class="spinner"></div><p>Running query…</p></div>`;
    document.getElementById('pagination').style.display = 'none';

    try {
      const data = await fetch(`${API}/api/db-query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql })
      }).then(r => r.json());

      if (data.success) {
        allRows = data.result;
        renderRows(data.result);
      } else {
        document.getElementById('tableContent').innerHTML = `<div class="state-box"><h3>Query error</h3><p>${escHtml(data.error)}</p></div>`;
      }
    } catch(e) {
      document.getElementById('tableContent').innerHTML = `<div class="state-box"><h3>Request failed</h3><p>${e.message}</p></div>`;
    }
  }

  // ── Refresh all ───────────────────────────────────────────────────────────────
  function refreshAll() {
    loadDbInfo();
    if (customQueryLabel) return; // don't re-run arbitrary SQL on refresh
    loadTable(currentTable);
    showToast('Refreshed');
  }

  // ── Export CSV ────────────────────────────────────────────────────────────────
  function exportCSV() {
    if (!filteredRows.length) { showToast('No data to export'); return; }
    const cols = Object.keys(filteredRows[0]);
    const lines = [cols.join(','), ...filteredRows.map(row =>
      cols.map(c => `"${String(row[c] ?? '').replace(/"/g, '""')}"`).join(',')
    )];
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${currentTable}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    showToast(`Exported ${filteredRows.length} rows`);
  }

  // ── Reset to seed data ────────────────────────────────────────────────────────
  async function handleReset() {
    if (!confirm('Reset the database to default seed data? All changes will be lost.')) return;
    document.getElementById('resetBtn').disabled = true;
    try {
      const res = await fetch(`${API}/api/reset`, { method: 'POST' }).then(r => r.json());
      showToast(`Reset complete — ${res.data.length} workorders seeded`);
      refreshAll();
    } catch(e) {
      showToast('Reset failed: ' + e.message);
    } finally {
      document.getElementById('resetBtn').disabled = false;
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  async function init() {
    await loadDbInfo();
    // Also fetch item_options count
    try {
      const opts = await fetch(`${API}/api/db-table/item_options`).then(r => r.json());
      document.getElementById('cnt-item_options').textContent = opts.length;
    } catch(_) {}
    loadTable('workorders');
  }

  init();
</script>
</body>
</html>
